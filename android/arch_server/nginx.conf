worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    types_hash_max_size 4096;
    types_hash_bucket_size 128;

    # TÁCH RIÊNG BLOCK HTTP ĐỂ REDIRECT SANG HTTPS
    server {
        listen       8080 default_server;
        listen       [::]:8080 default_server;
        server_name  _;

        # Tự động chuyển hướng mọi request HTTP sang HTTPS ở port 8443
        return 301 https://$host:8443$request_uri;
    }

    # BLOCK CHÍNH CHẠY HTTPS
    server {
        listen       8443 ssl default_server;
        listen       [::]:8443 ssl default_server;
        server_name  _; # Chấp nhận mọi IP (192.168.1.76, 100.99.5.5...)

        ssl_certificate      /etc/nginx/ssl/nextcloud.crt;
        ssl_certificate_key  /etc/nginx/ssl/nextcloud.key;

        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        # BỔ SUNG: Các Header bảo mật bắt buộc của Nextcloud (để không bị cảnh báo trong Admin Panel)
        # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        # add_header X-Content-Type-Options "nosniff" always;
        # add_header X-Frame-Options "SAMEORIGIN" always;
        # add_header X-XSS-Protection "1; mode=block" always;
        # add_header Referrer-Policy "no-referrer" always;
        # add_header X-Download-Options "noopen" always;
        # add_header X-Permitted-Cross-Domain-Policies "none" always;

        root         /usr/share/webapps/nextcloud;

        client_max_body_size 16G;
        fastcgi_buffers 64 4K;

        index index.php index.html /index.php$request_uri;

        # Bảo mật tầng Core
        location ~ ^\/(?:build|tests|config|lib|3rdparty|templates|data)\/ { deny all; }
        location ~ ^\/(?:\.|autotest|occ|issue|indie|db_|console) { deny all; }

        # FIX 2: Sử dụng try_files thay vì rewrite vô điều kiện
        location / {
            rewrite ^ /index.php$request_uri;
        }

        # Sửa lỗi WebDAV endpoint khoảng trắng cũ
        location = /.well-known/carddav { return 301 /remote.php/dav/; }
        location = /.well-known/caldav  { return 301 /remote.php/dav/; }

        # Thực thi PHP
        location ~ ^\/(?:index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocm-provider\/.+)\.php(?:$|\/) {
            fastcgi_split_path_info ^(.+?\.php)(\/.*)$;
            set $path_info $fastcgi_path_info;
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
            fastcgi_intercept_errors on;
            fastcgi_request_buffering off;
            
            # Khẳng định với PHP rằng request này là HTTPS (tránh lỗi chuyển hướng lặp)
            fastcgi_param HTTPS on; 
        }

        # Cache cho các file tĩnh
        location ~* \.(?:css|js|woff2?|svg|gif|map)$ {
            try_files $uri /index.php$request_uri;
            add_header Cache-Control "public, max-age=15778463";
            access_log off;
        }

        location ~* \.(?:png|html|ttf|ico|jpg|jpeg|bcmap|mp4|webm)$ {
            try_files $uri /index.php$request_uri;
            access_log off;
        }
    }
}
