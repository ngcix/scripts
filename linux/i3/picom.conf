# ═══════════════════════════════════════
# ROUNDED CORNERS
# ═══════════════════════════════════════
corner-radius = 10.0;

rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ═══════════════════════════════════════
# SHADOW
# ═══════════════════════════════════════
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;

shadow-exclude = [
    "class_g = 'Polybar'",
    "window_type = 'dock'"
];

# ═══════════════════════════════════════
# TRANSPARENCY / OPACITY
# ═══════════════════════════════════════
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'Google-chrome'",
    "100:class_g = 'mpv'",
    "90:class_g = 'Alacritty'",
    "90:class_g = 'kitty'"
];

# ═══════════════════════════════════════
# FADING (Hiệu ứng mở/đóng window)
# ═══════════════════════════════════════
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;

# ═══════════════════════════════════════
# BACKEND
# ═══════════════════════════════════════
backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# ═══════════════════════════════════════
# GLX BACKEND
# ═══════════════════════════════════════
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
